<div class="container-modal" [style.--habit-color]="corDestaque">
  <header class="header">
    <div
      class="preview-icon"
      [style.color]="corDestaque"
      [style.border-color]="corDestaque"
    >
      <mat-icon>{{ iconName }}</mat-icon>
    </div>
    <div class="heading-copy">
      <h2>{{ data?.mode === 'edit' ? 'Editar hábito' : 'Novo hábito' }}</h2>
      <p>{{ habitPreview.name || 'Defina um hábito simples para repetir todo dia' }}</p>
    </div>
    <button mat-icon-button type="button" aria-label="Fechar" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <form [formGroup]="habitoForm" (ngSubmit)="addHabit()">
    <div class="field-group">
      <label for="habit-name">Nome do hábito <span>*</span></label>
      <input
        id="habit-name"
        class="text-input"
        formControlName="nome"
        placeholder="Ex.: Beber água"
        autocomplete="off"
      />
    </div>

    <section class="field-group icon-section">
      <label>Ícone</label>
      <div class="icon-list">
        <button
          type="button"
          *ngFor="let ic of icons"
          class="icon-choice"
          [class.selected]="habitPreview.icon === ic.value"
          [attr.aria-label]="ic.label"
          [attr.aria-pressed]="habitPreview.icon === ic.value"
          (click)="selectIcon(ic.value)"
        >
          <mat-icon>{{ ic.name }}</mat-icon>
        </button>
      </div>
    </section>

    <div class="field-group target-section">
      <label for="habit-target">Meta <span>*</span></label>
      <input
        id="habit-target"
        class="text-input"
        formControlName="target"
        placeholder="Meta: Beber 2 litros de água"
      />
      <small>Descreva livremente, ex.: “Ler 20 páginas”.</small>
    </div>

    <section class="field-group color-section">
      <label>Cor</label>
      <div class="color-list">
        <button
          type="button"
          *ngFor="let color of colors"
          class="color-choice"
          [style.background-color]="color"
          [class.selected]="habitPreview.color === color"
          [class.escura]="isCorEscura(color)"
          [attr.aria-label]="'Selecionar cor ' + color"
          [attr.aria-pressed]="habitPreview.color === color"
          (click)="selectColor(color)"
        >
          <mat-icon *ngIf="habitPreview.color === color">check</mat-icon>
        </button>
      </div>
    </section>

    <footer class="actions">
      <button mat-button type="button" class="cancel" (click)="close()">Cancelar</button>
      <button
        (click)="addHabit()"
        mat-flat-button
        type="submit"
        class="add"
        [disabled]="habitoForm.invalid"
      >
        {{ data?.mode === 'edit' ? 'Salvar' : 'Adicionar' }}
      </button>
    </footer>
  </form>
</div>
