<div class="conteudo">
  <div class="cards">
    <app-card
      *ngFor="let card of listCards"
      [description]="card.description"
      [complement]="card.complement"
      [icon]="card.icon"
    ></app-card>
  </div>

  <div class="habts">
    <div class="habits-heading">
      <div class="heading-copy">
        <h3>Hábitos de Hoje</h3>
        <span>{{ habitosConcluidos }} de {{ listHabitos.length }} concluídos</span>
      </div>
      <button class="add" (click)="openAddHabitModal()"><mat-icon>add</mat-icon>Adicionar hábito</button>
    </div>

    <div class="cards-horizontal">
      <app-card-horizont
        *ngFor="let habito of listHabitos; let i = index"
        [index]="i"
        (habitChanged)="onHabitChanged($event)"
        (habitDelete)="deleteHabit($event, habito)"
        (habitUpdate)="updateHabit($event)"
        [current]="habito.current ?? 0"
        [habito]="habito"
      ></app-card-horizont>
    </div>
  </div>

  <footer>
    <h3>Continue assim! 💪</h3>
    <span>
      {{
        restante === 0
          ? 'Parabéns! Você completou todas as suas metas de hoje!'
          : 'Você está a ' + restante + '% de completar todas as suas metas de hoje.'
      }}
    </span>
  </footer>
</div>
